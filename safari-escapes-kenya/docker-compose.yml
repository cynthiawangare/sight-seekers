version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: safari_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safari_escapes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safari_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
